# Servidor OT + duas pontes WebSocket/TCP.
#
# Por que duas pontes: o OTClient faz DUAS conexoes. A primeira vai para o
# login server (host:porta digitados na tela). O login responde dizendo onde
# fica o mundo, e o cliente abre uma segunda conexao para
# wss://<ip anunciado>:<CANARY_GAME_PORT>. Cada uma precisa do seu endpoint.
#
# O Canary se configura por variaveis CANARY_* -- o entrypoint reescreve o
# config.lua sozinho. Nao monte um config.lua aqui: alem de ignorado, se for
# montado como somente-leitura o entrypoint falha e o servidor fica preso em
# "DB offline, trying again".
# Todo servico usa restart: unless-stopped de proposito. O daemon do Docker
# sobe junto com o codespace, entao os containers voltam sozinhos depois de
# cada hibernacao -- sem hook do Codespaces, sem script, sem terminal. Os
# hooks de ciclo de vida se mostraram nao confiaveis aqui.
services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: canary
      MARIADB_USER: canary
      MARIADB_PASSWORD: canary
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20

  canary:
    image: ghcr.io/opentibiabr/canary:latest
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      CANARY_DB_HOST: mariadb
      CANARY_DB_PORT: 3306
      CANARY_DB_NAME: canary
      CANARY_DB_USER: canary
      CANARY_DB_PASSWORD: canary

      CANARY_SERVER_NAME: Ravenhold
      # hostname publico do MUNDO do jogo -- gravado em .env pelo script de setup
      CANARY_SERVER_IP: ${GAME_HOST:?rode o script de setup primeiro para gerar .env}

      CANARY_LOGIN_PORT: 7171
      # 443 porque e o valor que o cliente usa literalmente na segunda conexao,
      # e as plataformas publicam tudo na 443
      CANARY_GAME_PORT: 443
      CANARY_STATUS_PORT: 7173

      CANARY_TEST_ACCOUNTS: "true"
      CANARY_DATA_PACK: data-otservbr-global
      CANARY_MAP_URL: https://github.com/opentibiabr/canary/releases/download/v3.6.1/otservbr.otbm
    volumes:
      - server-data:/data
    expose:
      - "7171"
      - "443"

  # API de contas do Ravenhold (criacao de conta pela tela do cliente)
  auth:
    build: ./auth
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PORT: "8081"
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_USER: canary
      DB_PASSWORD: canary
      DB_NAME: canary
      # Vao na resposta do login web service: e daqui que o cliente tira o
      # endereco do mundo para a segunda conexao, nao do que foi digitado.
      GAME_HOST: ${GAME_HOST:?rode o script de setup primeiro para gerar .env}
      GAME_PORT: "443"
      WORLD_NAME: Ravenhold

  proxy-login:
    build: ./proxy
    restart: unless-stopped
    depends_on: [canary]
    environment:
      PORT: "7171"
      TARGET_HOST: "canary"
      TARGET_PORT: "7171"

  proxy-game:
    build: ./proxy
    restart: unless-stopped
    depends_on: [canary]
    environment:
      PORT: "8443"
      TARGET_HOST: "canary"
      TARGET_PORT: "443"

  # O cliente web tambem roda em container: era a unica peca solta, tocada
  # por "nohup node ... &", e justamente a que morria a cada hibernacao.
  client:
    build: ./client
    restart: unless-stopped
    environment:
      PORT: "8080"
      CLIENT_DIR: /client/build-emscripten-web
      AUTH_ORIGIN: http://auth:8081
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-juninhorosa/tibiaweb}
    volumes:
      - /workspaces/client-build:/client

volumes:
  db:
  server-data:
