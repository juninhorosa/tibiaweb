# Servidor OT + duas pontes WebSocket/TCP.
#
# Por que duas pontes: o OTClient faz DUAS conexoes. A primeira vai para o
# login server (host:porta digitados na tela). O login responde dizendo onde
# fica o mundo, e o cliente abre uma segunda conexao para
# wss://<ip anunciado>:<CANARY_GAME_PORT>. Cada uma precisa do seu endpoint.
#
# O Canary se configura por variaveis CANARY_* -- o entrypoint reescreve o
# config.lua sozinho. Nao monte um config.lua aqui: alem de ignorado, se for
# montado como somente-leitura o entrypoint falha e o servidor fica preso em
# "DB offline, trying again".
services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: canary
      MARIADB_USER: canary
      MARIADB_PASSWORD: canary
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20

  canary:
    image: ghcr.io/opentibiabr/canary:latest
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      CANARY_DB_HOST: mariadb
      CANARY_DB_PORT: 3306
      CANARY_DB_NAME: canary
      CANARY_DB_USER: canary
      CANARY_DB_PASSWORD: canary

      CANARY_SERVER_NAME: Ravenhold
      # hostname publico do MUNDO do jogo -- gravado em .env pelo script de setup
      CANARY_SERVER_IP: ${GAME_HOST:?rode o script de setup primeiro para gerar .env}

      CANARY_LOGIN_PORT: 7171
      # 443 porque e o valor que o cliente usa literalmente na segunda conexao,
      # e as plataformas publicam tudo na 443
      CANARY_GAME_PORT: 443
      CANARY_STATUS_PORT: 7173

      CANARY_TEST_ACCOUNTS: "true"
      CANARY_DATA_PACK: data-otservbr-global
      CANARY_MAP_URL: https://github.com/opentibiabr/canary/releases/download/v3.6.1/otservbr.otbm
    volumes:
      - server-data:/data
    expose:
      - "7171"
      - "443"

  # API de contas do Ravenhold (criacao de conta pela tela do cliente)
  auth:
    build: ./auth
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PORT: "8081"
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_USER: canary
      DB_PASSWORD: canary
      DB_NAME: canary

  proxy-login:
    build: ./proxy
    depends_on: [canary]
    environment:
      PORT: "7171"
      TARGET_HOST: "canary"
      TARGET_PORT: "7171"

  proxy-game:
    build: ./proxy
    depends_on: [canary]
    environment:
      PORT: "8443"
      TARGET_HOST: "canary"
      TARGET_PORT: "443"

volumes:
  db:
  server-data:
