# Override para Cloudflare Tunnel (servidor na sua maquina).
#
# O cloudflared termina TLS na borda da Cloudflare e fala HTTP simples com o
# localhost, entao os proxies rodam sem certificado.
services:
  proxy-login:
    ports:
      - "127.0.0.1:7171:7171"

  proxy-game:
    ports:
      - "127.0.0.1:8443:8443"
