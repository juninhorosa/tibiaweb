# Override para GitHub Codespaces.
#
# O encaminhamento de portas termina TLS na borda e fala HTTP simples com o
# container, entao os proxies rodam sem certificado -- o cliente continua
# vendo wss://, que e o que o build Release exige.
services:
  proxy-login:
    ports:
      - "7171:7171"

  proxy-game:
    ports:
      - "8443:8443"
