name: Build Web (WASM)

# Compila SOMENTE o bundle do navegador (emscripten/WebAssembly).
# Evita o ci.yml, cujo workflow_dispatch dispara Windows/macOS/Android tambem.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "browser/**"
      - "modules/**"
      - "data/**"
      - "init.lua"
      - "otclientrc.lua"
      - "Dockerfile.browser"
      - "Dockerfile.browser.sh"
      - ".github/workflows/build-web.yml"

permissions:
  contents: read

jobs:
  build:
    name: Browser Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BUILD_LOG: docker-browser-build.log
      OUTPUT_DIR: build-emscripten-web
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Liberar espaco no runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      # Os assets vao ASSADOS no bundle, nao baixados em tempo de execucao.
      # O src/CMakeLists.txt ja faz --preload-file=../data@data, entao tudo que
      # estiver em data/things/1525 vira parte do .data -- um download unico e
      # cacheavel. A alternativa era o auto-install do client_assets, que puxa
      # 6855 arquivos um a um no navegador; nao e viavel.
      #
      # A versao e 1511, nao 1525, porque e a que o BINARIO do Canary v3.6.1
# espera. O branch main do Canary ja usa 1525, mas quem roda aqui e o
# release -- conferir o main foi o que me fez errar isto uma vez.
#
# sparse-checkout em vez do zip da release: o zip tem 395 MB porque
      # carrega bin/ (client.exe, Qt, BattlEye), inutil no navegador. Assim
      # baixamos so os 110 MB de assets/. sounds/ (97 MB) fica de fora de
      # proposito -- o cliente roda sem eles.
      - name: Assar os assets do cliente no bundle
        env:
          ASSETS_REPO: dudantas/tibia-client
          ASSETS_TAG: 15.11.c9d1cf
          CLIENT_VERSION: "1511"
        run: |
          set -euo pipefail
          dest="data/things/${CLIENT_VERSION}"
          git clone --filter=blob:none --no-checkout --depth 1 --branch "${ASSETS_TAG}" "https://github.com/${ASSETS_REPO}.git" /tmp/tibia-assets
          git -C /tmp/tibia-assets sparse-checkout set --no-cone '/assets/' '/assets.json.sha256'
          git -C /tmp/tibia-assets checkout
          mkdir -p "${dest}"
          cp -a /tmp/tibia-assets/assets/. "${dest}/"
          cp -a /tmp/tibia-assets/assets.json.sha256 "${dest}/"
          rm -rf /tmp/tibia-assets
          # isClientVersionInstalled (client_assets.lua:401) exige estes dois
          # arquivos MAIS os do catalogo. Faltando qualquer um, o cliente decide
          # que a versao nao esta instalada e cai no download em tempo de
          # execucao -- exatamente o que este passo existe para evitar.
          for f in catalog-content.json assets.json.sha256; do
            test -f "${dest}/${f}" || { echo "FALTOU ${f}"; exit 1; }
          done
          # jq, e nao heredoc: dentro de um bloco "run: |" o delimitador de
          # heredoc precisaria comecar na coluna 0, o que quebra a indentacao
          # do YAML.
          faltando=0
          while read -r f; do
            [ -f "${dest}/${f}" ] || { echo "FALTOU do catalogo: ${f}"; faltando=1; }
          done < <(jq -r '.[] | select(.type=="appearances" or .type=="staticdata" or .type=="proficiencies") | .file' "${dest}/catalog-content.json")
          [ "${faltando}" -eq 0 ]
          echo "catalogo ok: $(jq 'length' "${dest}/catalog-content.json") entradas"
          echo "tamanho: $(du -sh "${dest}" | cut -f1) em $(ls "${dest}" | wc -l) arquivos"
          df -h / | tail -1

      - name: Build do bundle WASM via Docker
        run: bash Dockerfile.browser.sh

      - name: Adicionar headers do Cloudflare Pages
        run: |
          cp webdeploy/pages/_headers "${OUTPUT_DIR}/_headers"
          ls -la "${OUTPUT_DIR}"

      - name: Upload do artefato
        uses: actions/upload-artifact@v7
        with:
          name: otclient-web-${{ github.sha }}
          path: |
            ${{ env.BUILD_LOG }}
            ${{ env.OUTPUT_DIR }}
          retention-days: 14
